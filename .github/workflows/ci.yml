name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@v2

      - name: Build renderer
        working-directory: renderer
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build

      - name: Test
        run: dotnet test --project tests/Mdnet.Tests

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: |
          VERSION=0.1.0-ci.${{ github.run_number }}
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION=${GITHUB_REF#refs/tags/v}; fi
          dotnet pack src/Mdnet -c Release -p:Version=$VERSION

      - name: Smoke test packed tool
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet tool install mdnet --tool-path ./.tool --add-source ./nupkg --prerelease
          ./.tool/mdnet generate samples/Sample.Lib -o ./out
          test -f ./out/md/Sample.Lib/mdnet.json
          test -f ./out/html/Sample.Lib/Core.Data.Repositories/EntityFrameworkRepository-1.html

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: nupkg
          path: nupkg/*.nupkg

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write # GitHub OIDC token for NuGet/login (trusted publishing)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkg
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        run: dotnet nuget push "nupkg/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
