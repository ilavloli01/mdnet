name: pages

on:
  push:
    branches: [main]
    paths:
      - website/**
      - renderer/**
      - samples/**
      - src/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@v2

      - name: Build renderer
        working-directory: renderer
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build site
        run: |
          mkdir -p _site
          cp -r website/. _site/
          # Live demo: the sample library documented by mdnet itself
          dotnet run --project src/Mdnet -c Release -- generate samples/Sample.Lib -o ./out
          cp -r out/html _site/demo
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
